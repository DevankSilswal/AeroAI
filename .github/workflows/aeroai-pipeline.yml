name: AeroAI Automated Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aeroai-pipeline.yml"
      - "src/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: aeroai-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-aeroai:
    name: Collect, process, monitor and forecast
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
      XKDR_API_KEY: ${{ secrets.XKDR_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout AeroAI
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests scikit-learn xgboost python-dotenv joblib scipy mlflow streamlit plotly matplotlib
          fi

      - name: Restore AeroAI runtime data
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
            data/monitoring
            models
          key: aeroai-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aeroai-state-${{ runner.os }}-

      - name: Run AeroAI pipeline
        id: pipeline
        shell: bash
        run: |
          mkdir -p data/monitoring logs
          set +e
          python src/run_pipeline.py
          pipeline_exit_code=$?
          set -e

          if [ "$pipeline_exit_code" -eq 0 ]; then
            echo "AeroAI pipeline completed successfully."
          elif [ "$pipeline_exit_code" -eq 2 ]; then
            echo "::warning::AeroAI pipeline completed with PARTIAL_SUCCESS. Check the stage-by-stage summary for stale or unavailable data sources."
          else
            echo "::error::AeroAI pipeline failed with exit code $pipeline_exit_code."
            exit "$pipeline_exit_code"
          fi

      - name: Publish stage-by-stage pipeline summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("data/monitoring/pipeline_status.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if not report_path.exists():
              message = "## AeroAI Pipeline Summary\n\nPipeline report was not generated. Check the **Run AeroAI pipeline** logs."
              print(message)
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as f:
                      f.write(message + "\n")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          stages = report.get("stages", [])
          final_status = report.get("final_status", "UNKNOWN")

          lines = [
              "# AeroAI — Pipeline Execution Summary",
              "",
              f"**Overall status:** `{final_status}`",
              "",
              f"**Started:** {report.get('started_at', 'N/A')}  ",
              f"**Completed:** {report.get('completed_at', 'N/A')}",
              "",
              "| # | Pipeline stage | Result |",
              "|---:|---|---|",
          ]

          for index, item in enumerate(stages, start=1):
              name = str(item.get("stage", "Unknown")).replace("|", "\\|")
              status = str(item.get("status", "UNKNOWN"))
              lines.append(f"| {index} | {name} | `{status}` |")

          lines.extend([
              "",
              f"**Stages reported:** {len(stages)}",
              "",
              "> SUCCESS means the stage completed and passed its output freshness/quality check. SKIPPED statuses mean an upstream dependency or required fresh input was unavailable. SOURCE_UNAVAILABLE / STALE_DATA are source-health outcomes, not successful data refreshes.",
          ])

          output = "\n".join(lines) + "\n"
          print(output)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(output)
          PY

      - name: Upload pipeline reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeroai-pipeline-report-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/monitoring/pipeline_status.json
            data/monitoring/*.json
            logs/
