name: AeroAI Automated Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aeroai-pipeline.yml"
      - "src/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: aeroai-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-aeroai:
    name: AeroAI end-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
      XKDR_API_KEY: ${{ secrets.XKDR_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout AeroAI
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests scikit-learn xgboost python-dotenv joblib scipy mlflow streamlit plotly matplotlib
          fi

      - name: Restore AeroAI runtime data
        uses: actions/cache@v5
        with:
          path: |
            data/incoming
            data/raw
            data/processed
            data/monitoring
            data/predictions
            models
          key: aeroai-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aeroai-state-${{ runner.os }}-

      - name: Initialize staged pipeline
        run: python src/run_pipeline.py --init

      - name: CPCB Current AQI Refresh
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "CPCB Current AQI Refresh"

      - name: OpenAQ Live Sensor Refresh
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "OpenAQ Live Sensor Refresh"

      - name: Daily Data Collection
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Daily Data Collection"

      - name: Hourly Data Collection
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Hourly Data Collection"

      - name: Daily Preprocessing
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Daily Preprocessing"

      - name: Hourly Preprocessing
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Hourly Preprocessing"

      - name: AQI Calculation
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "AQI Calculation"

      - name: AQI Prediction
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "AQI Prediction"

      - name: Daily Data Drift Detection
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Daily Data Drift Detection"

      - name: Prediction Performance Monitoring
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Prediction Performance Monitoring"

      - name: Hourly Anomaly Detection
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Hourly Anomaly Detection"

      - name: Pollution Episode Aggregation
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Pollution Episode Aggregation"

      - name: Intelligent Retraining Decision
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Intelligent Retraining Decision"

      - name: OpenAQ Historical Hourly Refresh
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "OpenAQ Historical Hourly Refresh"

      - name: OpenAQ Hourly AQI Processing
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "OpenAQ Hourly AQI Processing"

      - name: OpenAQ Daily Forecast Dataset
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "OpenAQ Daily Forecast Dataset"

      - name: OpenAQ Demo Retraining and Forecast
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "OpenAQ Demo Retraining and Forecast"

      - name: OpenAQ Hourly Anomaly Detection
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "OpenAQ Hourly Anomaly Detection"

      - name: OpenAQ Pollution Episode Aggregation
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "OpenAQ Pollution Episode Aggregation"

      - name: Candidate Training and Validation
        if: always()
        shell: bash
        run: python src/run_pipeline.py --stage "Candidate Training and Validation"

      - name: Finalize pipeline and determine overall status
        if: always()
        shell: bash
        run: |
          set +e
          python src/run_pipeline.py --finalize
          pipeline_exit_code=$?
          set -e
          if [ "$pipeline_exit_code" -eq 0 ]; then
            echo "AeroAI pipeline completed successfully."
          elif [ "$pipeline_exit_code" -eq 2 ]; then
            echo "::warning::AeroAI completed with PARTIAL_SUCCESS. Inspect individual stage results and the summary."
          else
            echo "::error::AeroAI pipeline failed. Inspect stage logs and report."
            exit "$pipeline_exit_code"
          fi

      - name: Publish stage-by-stage pipeline summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("data/monitoring/pipeline_status.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if not report_path.exists():
              message = "## AeroAI Pipeline Summary\n\nPipeline report was not generated. Check the stage logs."
              print(message)
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as f:
                      f.write(message + "\n")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          stages = report.get("stages", [])
          final_status = report.get("final_status", "UNKNOWN")

          lines = [
              "# AeroAI — Pipeline Execution Summary",
              "",
              f"**Overall status:** `{final_status}`",
              "",
              f"**Started:** {report.get('started_at', 'N/A')}  ",
              f"**Completed:** {report.get('completed_at', 'N/A')}",
              "",
              "| # | Pipeline stage | Result |",
              "|---:|---|---|",
          ]

          for index, item in enumerate(stages, start=1):
              name = str(item.get("stage", "Unknown")).replace("|", "\\|")
              status = str(item.get("status", "UNKNOWN"))
              lines.append(f"| {index} | {name} | `{status}` |")

          lines.extend([
              "",
              f"**Stages reported:** {len(stages)}",
              "",
              "> Each named GitHub Actions step executes its corresponding Python stage. SUCCESS means output validation passed. SKIPPED means a required upstream input was not fresh or a conditional gate was not met. OpenAQ-derived AQI is an estimate, not official CPCB station AQI.",
          ])

          output = "\n".join(lines) + "\n"
          print(output)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(output)
          PY

      - name: Upload pipeline reports and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aeroai-pipeline-report-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/monitoring/pipeline_status.json
            data/monitoring/pipeline_execution_state.json
            data/monitoring/*.json
            logs/
